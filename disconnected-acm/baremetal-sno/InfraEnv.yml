---
apiVersion: agent-install.openshift.io/v1beta1
kind: InfraEnv
metadata:
  name: ocp2
  namespace: ocp2
  labels:
    networkType: static
spec:
  agentLabelSelector: {}
  ignitionConfigOverride: |
    {
      "ignition": {
        "version": "3.2.0"             ## to override DRAC 
      }
    }
  pullSecretRef:
    name: pullsecret
  nmStateConfigLabelSelector:
    matchExpressions:
    - key: network
      operator: In
      values:
      - sno 
  cpuArchitecture: x86_64
  osImageVersion: "4.17"
  sshAuthorizedKey: '<public key with hostname'
  additionalTrustBundle: |
    -----BEGIN CERTIFICATE-----
    < Mirror Registry Root CA Cert >
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    < Default Ingress Router CA Cert >
    -----END CERTIFICATE-----
