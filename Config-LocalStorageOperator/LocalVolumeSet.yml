apiVersion: local.storage.openshift.io/v1alpha1
kind: LocalVolumeSet
metadata:
  finalizers:
  - storage.openshift.com/local-volume-protection
  name: vmdisk-worker2
  namespace: openshift-local-storage
spec:
  deviceInclusionSpec:
    deviceTypes:
    - disk
    - part
    minSize: 1Gi
  fsType: xfs
  nodeSelector:
    nodeSelectorTerms:
    - matchExpressions:
      - key: kubernetes.io/hostname
        operator: In
        values:
        - worker2.ocp.pdlab.sg
  storageClassName: vmdisk-worker2
  volumeMode: Filesystem
