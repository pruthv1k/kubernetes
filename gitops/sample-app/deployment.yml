kind: Deployment
apiVersion: apps/v1
metadata:
  name: pru-app
  namespace: pru-sample
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pru-app
  template:
    metadata:
      labels:
        app: pru-app
    spec:
      containers:
        - name: container
          image: 'quay.io/openshifttest/deployment-example:latest'
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600